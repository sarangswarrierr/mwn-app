         checks in scripts/check-theme.mjs fail the build if this drifts. -->
    <script>
      (function () {
        var d = document.documentElement;
        function get(k) {
          try { return localStorage.getItem(k); } catch (e) { return null; }
        }
        var theme = get("mcu_theme") || "avengers";
        var bg = null;
        try { bg = JSON.parse(get("mcu_bg")); } catch (e) {}
        if (!bg || typeof bg !== "object") bg = {};
        // The backdrop is always a generated scene: `ref` is a theme id that
        // pins one, or null to follow the active theme. Anything else — a URL,
        // a number, a leftover value from the old image option — falls back to
        // following the theme, so no stored state can produce a blank page.
        var ref = typeof bg.ref === "string" ? bg.ref : null;
        var overlay = Number(bg.overlay);
        if (!(overlay >= 0)) overlay = 55;
        var blur = Number(bg.blur);
        if (!(blur >= 0)) blur = 0;
        var fx = get("mcu_fx") === "1";
        d.dataset.theme = theme;
        d.dataset.scene = ref || theme;
        d.dataset.fixed = bg.fixed === false ? "0" : "1";

        d.dataset.fx = fx ? "off" : "on";
        d.style.setProperty("--bg-blur", Math.min(blur, 20) + "px");
        // Scenes are dark by design, so this scrim is tuned to keep the art
        // visible without lifting copy off its background.
        d.style.setProperty("--scrim-a", (0.3 + overlay * 0.0055).toFixed(3));
        d.style.setProperty("--scrim-b", (0.55 + overlay * 0.004).toFixed(3));
      })();
