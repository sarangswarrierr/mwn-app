# The single source of truth for the app's version. android/app/build.gradle
# reads this, and `npm run version` bumps it, so the number never has to be
# edited in two places.
#
# versionCode must strictly increase with every upload to Play Console or the
# upload is rejected. Play's ceiling is 2100000000.
# versionName is the label a human reads ("1.0.0"); any format is accepted.
versionCode=1
versionName=1.0.0
